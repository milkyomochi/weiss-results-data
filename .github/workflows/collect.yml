name: Collect WS results
on:
  schedule:
    - cron: '0 23 * * *' # 08:00 Asia/Tokyo; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-results
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect, deduplicate and validate
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONUTF8: '1'
        run: python collector/run.py
      - name: Persist search reservations
        if: always()
        run: |
          if ! git diff --quiet -- collector/x_sources.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add collector/x_sources.json
            git commit -m 'Record discovery candidates and search budget'
            git push
          fi
      - name: Commit validated data
        run: |
          if ! git diff --quiet -- data/results.json data/collection.json collector/x_sources.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/results.json data/collection.json collector/x_sources.json
            git commit -m 'Update tournament results'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-data
      - name: Publish validated results and status
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Report incomplete collection as a failure
        run: |
          python - <<'PY'
          import json, os, sys
          state = json.load(open('.run-status.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Validated data was published. Collection status: ' + state['status'] + '\n')
              f.write('Sources needing attention: ' + ', '.join(state['failedSources']) + '\n')
              f.write('\nTavily discovery report:\n```json\n' + json.dumps(state['discovery'], ensure_ascii=False, indent=2) + '\n```\n')
          sys.exit(0 if state['status'] == 'ok' else 1)
          PY
